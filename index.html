<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Berichtsheft</title>

<style>
body{
  font-family: Arial, sans-serif;
  background:#0f0f0f;
  color:white;
  margin:20px;
}

.container{
  max-width:900px;
  margin:auto;
  background:#1c1c1c;
  padding:25px;
  border-radius:12px;
}

h1{ text-align:center; }

label{ font-weight:bold; }

input, textarea{
  width:100%;
  margin-top:5px;
  margin-bottom:20px;
  padding:10px;
  border-radius:8px;
  border:1px solid #333;
  background:#0f0f0f;
  color:white;
}

textarea{
  min-height:100px;
  resize:vertical;
  white-space: pre-wrap;
}

button{
  padding:12px 20px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  font-size:16px;
  background:#1e88e5;
  color:white;
}

button:disabled{
  opacity:0.5;
}
</style>
</head>

<body>

<div class="container">

<h1>Berichtsheft</h1>

<label>Kalenderwoche (KW):</label>
<input type="number" id="kw" min="1" max="53" oninput="updateDates(); checkFields()">

<label>Jahr:</label>
<input type="number" id="jahr" value="2026" oninput="updateDates(); checkFields()">

<label>Azubi:</label>
<input type="text" id="azubi" oninput="checkFields()">

<label>Ausbilder:</label>
<input type="text" id="ausbilder" oninput="checkFields()">

<h3>Montag</h3>
<textarea id="montag" oninput="checkFields()"></textarea>

<h3>Dienstag</h3>
<textarea id="dienstag" oninput="checkFields()"></textarea>

<h3>Mittwoch</h3>
<textarea id="mittwoch" oninput="checkFields()"></textarea>

<h3>Donnerstag</h3>
<textarea id="donnerstag" oninput="checkFields()"></textarea>

<h3>Freitag</h3>
<textarea id="freitag" oninput="checkFields()"></textarea>

<h3>Individuell (Auto-Verteilung)</h3>
<textarea id="auto" oninput="autoFill()"></textarea>

<button id="wordBtn" onclick="downloadWord()" disabled>
Word herunterladen
</button>

</div>

<script>

/* ===== KW → Montag ===== */
function getMondayOfISOWeek(w, y) {
  const simple = new Date(y, 0, 1 + (w - 1) * 7);
  const dow = simple.getDay();
  const ISOweekStart = simple;

  if (dow <= 4)
    ISOweekStart.setDate(simple.getDate() - simple.getDay() + 1);
  else
    ISOweekStart.setDate(simple.getDate() + 8 - simple.getDay());

  return ISOweekStart;
}

function formatDate(d){
  return d.toLocaleDateString('de-DE');
}

function getWeekDates(){
  const kw = parseInt(document.getElementById('kw').value);
  const jahr = parseInt(document.getElementById('jahr').value);

  const monday = getMondayOfISOWeek(kw, jahr);

  return [
    new Date(monday),
    new Date(monday.getTime() + 86400000),
    new Date(monday.getTime() + 2*86400000),
    new Date(monday.getTime() + 3*86400000),
    new Date(monday.getTime() + 4*86400000)
  ];
}

/* ===== AUTO SORTIERUNG ===== */
function autoFill() {
  const text = document.getElementById("auto").value;

  const lines = text.split("\n");

  let current = null;

  const data = {
    montag: [],
    dienstag: [],
    mittwoch: [],
    donnerstag: [],
    freitag: []
  };

  function push(line){
    if(!current) return;
    data[current].push(line);
  }

  for(let line of lines){
    const l = line.trim();

    if(/^montag/i.test(l)) { current="montag"; continue; }
    if(/^dienstag/i.test(l)) { current="dienstag"; continue; }
    if(/^mittwoch/i.test(l)) { current="mittwoch"; continue; }
    if(/^donnerstag/i.test(l)) { current="donnerstag"; continue; }
    if(/^freitag/i.test(l)) { current="freitag"; continue; }

    push(l);
  }

  document.getElementById("montag").value = data.montag.join("\n");
  document.getElementById("dienstag").value = data.dienstag.join("\n");
  document.getElementById("mittwoch").value = data.mittwoch.join("\n");
  document.getElementById("donnerstag").value = data.donnerstag.join("\n");
  document.getElementById("freitag").value = data.freitag.join("\n");

  checkFields();
}

/* ===== CHECK ===== */
function checkFields(){
  const ok =
    document.getElementById('kw').value &&
    document.getElementById('jahr').value &&
    document.getElementById('azubi').value.trim() &&
    document.getElementById('ausbilder').value.trim() &&
    document.getElementById('montag').value.trim() &&
    document.getElementById('dienstag').value.trim() &&
    document.getElementById('mittwoch').value.trim() &&
    document.getElementById('donnerstag').value.trim() &&
    document.getElementById('freitag').value.trim();

  document.getElementById('wordBtn').disabled = !ok;
}

/* ===== FORMAT LISTE ===== */
function format(text){
  return text
    .split("\n")
    .filter(l => l.trim() !== "")
    .map(l => l.trim().startsWith("-") ? l.trim() : "- " + l.trim())
    .join("<br>");
}

/* ===== WORD EXPORT ===== */
function downloadWord(){

  const kw = document.getElementById('kw').value;
  const jahr = document.getElementById('jahr').value;
  const azubi = document.getElementById('azubi').value;
  const ausbilder = document.getElementById('ausbilder').value;

  const dates = getWeekDates();

  const html = `
  <html>
  <head><meta charset="utf-8"></head>

  <body style="font-family:Arial;color:black;">

    <h1>Berichtsheft</h1>

    <p><b>KW:</b> ${kw}</p>
    <p><b>Jahr:</b> ${jahr}</p>
    <p><b>Azubi:</b> ${azubi}</p>
    <p><b>Ausbilder:</b> ${ausbilder}</p>

    <table border="1" style="width:100%;border-collapse:collapse;">
      <tr>
        <th style="text-align:center;">Tag</th>
        <th style="text-align:center;">Datum</th>
        <th>Tätigkeit</th>
      </tr>

      <tr><td style="text-align:center;">Montag</td><td style="text-align:center;">${formatDate(dates[0])}</td><td>${format(document.getElementById('montag').value)}</td></tr>
      <tr><td style="text-align:center;">Dienstag</td><td style="text-align:center;">${formatDate(dates[1])}</td><td>${format(document.getElementById('dienstag').value)}</td></tr>
      <tr><td style="text-align:center;">Mittwoch</td><td style="text-align:center;">${formatDate(dates[2])}</td><td>${format(document.getElementById('mittwoch').value)}</td></tr>
      <tr><td style="text-align:center;">Donnerstag</td><td style="text-align:center;">${formatDate(dates[3])}</td><td>${format(document.getElementById('donnerstag').value)}</td></tr>
      <tr><td style="text-align:center;">Freitag</td><td style="text-align:center;">${formatDate(dates[4])}</td><td>${format(document.getElementById('freitag').value)}</td></tr>

    </table>

    <br><br><br>

    <table style="width:100%;margin-top:50px;">
      <tr>
        <td style="text-align:center;">
          ___________________________<br>
          Unterschrift Azubi
        </td>

        <td style="text-align:center;">
          ___________________________<br>
          Unterschrift Ausbilder
        </td>
      </tr>
    </table>

  </body>
  </html>
  `;

  const blob = new Blob([html], { type: "application/msword" });
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = `Berichtsheft_KW_${kw}.doc`;
  a.click();

  URL.revokeObjectURL(url);
}

</script>

</body>
</html>
